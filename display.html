
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- Force the page to match the 800x480 HDMI display -->
    <meta
        name="viewport"
        content="width=800, height=480, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Texas College Receptionist</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

    <div class="screen">

        <div class="header">
            <h1>Texas International College</h1>
            <p>Receptionist Assistant</p>
        </div>

        <div class="content">

            <div class="question-box">

                <div class="label">
                    QUESTION
                </div>

                <div id="question">
                    How can I help you today?
                </div>

            </div>

            <div class="answer-box">

                <div class="label">
                    ANSWER
                </div>

                <div id="answer">
                    Please ask me a question about the college.
                </div>

            </div>

        </div>

        <div class="footer">
            Texas International College
        </div>

    </div>

    <script src="/static/js/script.js"></script>

</body>

</html>
